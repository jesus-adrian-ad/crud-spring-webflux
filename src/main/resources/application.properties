###########################################
# Spring Application Properties
###########################################
spring.application.name=crud.wefblux
server.port=9091
###########################################
# DataBase Properties
###########################################
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/crud_db
spring.r2dbc.username=local
spring.r2dbc.password=postgres
###########################################
# Docker Compose Properties
# Levanta/apaga el docker-compose.yml junto con la aplicacion.
# lifecycle-management:
#   start_and_stop -> levanta al arrancar y apaga al detener la app (default)
#   start_only     -> solo levanta; la BD sigue viva al cerrar la app
#   none           -> no gestiona contenedores (usa una BD ya existente)
# Para deshabilitarlo por completo: spring.docker.compose.enabled=false
###########################################
spring.docker.compose.enabled=true
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start_and_stop
spring.docker.compose.readiness.timeout=2m
###########################################
# OpenAPI / Swagger Properties
# Swagger UI  -> http://localhost:9091/swagger-ui.html
# OpenAPI doc -> http://localhost:9091/v3/api-docs
###########################################
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
